# Tauri desktop backend crate. Spec: docs/desktop_app.md.
[package]
name = "p2pchat_desktop"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "1", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]
